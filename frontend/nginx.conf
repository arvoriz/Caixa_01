server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # PWA — service worker e metadados nunca devem ser cacheados,
  # senão os usuários ficam presos numa versão antiga do app.
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache";
  }
  location = /ngsw.json {
    add_header Cache-Control "no-cache";
  }
  location = /safety-worker.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
  }

  # Angular SPA — fallback para index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy das chamadas de API para o backend Rails
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
