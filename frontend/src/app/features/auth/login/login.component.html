<div class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <h2 class="login-card__title">Entrar</h2>
      <p class="login-card__subtitle">Acesse sua conta para continuar</p>
    </div>

    <form class="login-card__form" [formGroup]="form" (ngSubmit)="submit()">

      @if (error) {
        <div class="alert alert--error">{{ error }}</div>
      }

      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input
          id="email"
          class="form-input"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          autocomplete="email"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="form-error">E-mail inválido</span>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <input
          id="password"
          class="form-input"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="form-error">Senha deve ter no mínimo 6 caracteres</span>
        }
      </div>

      <button
        class="btn btn--primary btn--full"
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>
  </div>
</div>
