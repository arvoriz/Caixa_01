services:
  backend:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      SUPABASE_URL: ${SUPABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  bundle_cache:
  node_modules:
